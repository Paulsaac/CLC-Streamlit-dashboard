services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - dokploy-network
      - default
    volumes:
      - ./.streamlit:/app/.streamlit
    environment:
      - PYTHONUNBUFFERED=1
      - SECRETS_BASE64=${SECRETS_BASE64:-}
      - SECRETS_TOML=${SECRETS_TOML:-}


    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.clc-dashboard.rule=Host(`clc-reportes.leveraweb.com`) || Host(`clc-dashboard-d9zigw-ecc22f-23-88-44-117.sslip.io`)"
      - "traefik.http.routers.clc-dashboard.entrypoints=web,websecure"
      - "traefik.http.services.clc-dashboard.loadbalancer.server.port=8501"


networks:
  dokploy-network:
    external: true



