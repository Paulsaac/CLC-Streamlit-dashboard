name: Envio Automatico de Reporte Semanal

on:
  schedule:
    # Programación semanal: Todos los lunes a las 12:00 UTC (08:00 AM hora local Chile/Argentina)
    - cron: '0 12 * * 1'
  
  # Permite probar y ejecutar el envío manualmente desde la web de GitHub con un clic
  workflow_dispatch:

jobs:
  generar-y-enviar-reporte:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Inyectar credenciales seguras
        run: |
          mkdir -p .streamlit
          echo "${{ secrets.SECRETS_TOML }}" > .streamlit/secrets.toml

      - name: 5. Ejecutar generación y envío de reporte
        run: python send_scheduled_report.py
