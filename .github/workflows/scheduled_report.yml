name: Envio Automatico de Reporte Semanal

on:
  schedule:
    # Programación: 13:40 y 13:45 hora local (17:40 y 17:45 UTC)
    - cron: '40 17 * * *'
    - cron: '45 17 * * *'
  
  # Permite probar y ejecutar el envío manualmente desde la web de GitHub con un clic
  workflow_dispatch:

jobs:
  generar-y-enviar-reporte:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Inyectar credenciales seguras
        env:
          SECRETS_CONTENT: ${{ secrets.SECRETS_TOML }}
        run: |
          mkdir -p .streamlit
          python -c "import os; open('.streamlit/secrets.toml', 'w', encoding='utf-8').write(os.environ['SECRETS_CONTENT'])"

      - name: 5. Ejecutar generación y envío de reporte
        run: python send_scheduled_report.py
